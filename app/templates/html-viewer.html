<!doctype html><html lang="{{ language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t('ui.0230') }}</title><link rel="stylesheet" href="{{ url_for('static', filename='viewer.css', v=app_version) }}"></head><body><header class="viewer-toolbar"><form method="post" action="/language"><input type="hidden" name="csrf_token" value="{{ session.csrf }}"><input type="hidden" name="next" value="{{ request.full_path }}"><label for="viewer-language">{{ t('ui.0025') }}</label><select id="viewer-language" name="language">{% for code, label in languages.items() %}<option value="{{ code }}"{% if code == language %} selected{% endif %}>{{ label }}</option>{% endfor %}</select><button type="submit">{{ t('ui.0026') }}</button></form></header><iframe title="{{ t('ui.0231') }}" sandbox="allow-scripts" referrerpolicy="no-referrer" src="{{ src }}"></iframe></body></html>

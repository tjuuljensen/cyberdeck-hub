[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:cyberdeck

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:web]
command=/usr/bin/gunicorn --workers 2 --worker-class gthread --threads 4 --bind 0.0.0.0:8081 webapp:app
directory=/opt/cyberdeck/app
user=cyberdeck
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:kiwix]
command=/bin/bash -lc 'while true; do if compgen -G "/srv/cyberdeck/zim/*.zim" > /dev/null; then exec /usr/local/bin/serve-cyberdeck-kiwix; fi; sleep 30; done'
directory=/opt/cyberdeck/app
user=cyberdeck
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

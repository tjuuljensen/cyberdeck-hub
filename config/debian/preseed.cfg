#_preseed_V1
# Debian 13 Cyberdeck installer defaults. No disk, partition or password is preseeded.
# Country and time-zone selection remain part of Debian's guided installer flow.
# This USB preseed is loaded after the installer's initial language/keyboard screens.
# Debian Installer's automatic choice prefers an interface with link. Keep
# this generic because interface names vary between machines.
d-i netcfg/choose_interface select auto
# Allow slower wired NICs time to report carrier before netcfg picks an interface.
d-i netcfg/link_wait_timeout string 10
d-i netcfg/get_hostname string cyberdeck
d-i netcfg/get_domain string
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Cyberdeck Operator
d-i passwd/username string operator
d-i passwd/username seen false
d-i debian-installer/language string en
d-i debian-installer/locale string en_GB.UTF-8
d-i keyboard-configuration/model select Generic 105-key PC
d-i keyboard-configuration/modelcode string pc105
d-i keyboard-configuration/xkb-keymap select dk
d-i keyboard-configuration/toggle select No toggling
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
tasksel tasksel/first multiselect standard, ssh-server
popularity-contest popularity-contest/participate boolean false
d-i preseed/late_command string mkdir -p /target/var/lib/cyberdeck-bootstrap /target/usr/local/sbin /target/etc/profile.d && cp /cdrom/cyberdeck-install-kit.tar.gz /target/var/lib/cyberdeck-bootstrap/source.tar.gz && cp /cdrom/cyberdeck-firstboot-install.sh /target/usr/local/sbin/cyberdeck-firstboot-install && chmod 0755 /target/usr/local/sbin/cyberdeck-firstboot-install && cp /cdrom/cyberdeck-firstboot-profile.sh /target/etc/profile.d/cyberdeck-firstboot.sh && chmod 0644 /target/etc/profile.d/cyberdeck-firstboot.sh && touch /target/var/lib/cyberdeck-bootstrap/pending
